<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Misión secreta: cine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --rojo:#e62429; --azul:#1c3faa; --negro:#0b0b12; --papel:#fff6d6; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{overflow-x:hidden}
  body{font-family:'Nunito',sans-serif;color:#111;min-height:100vh;min-height:100svh;overflow-x:hidden;
    background:
      radial-gradient(circle,rgba(255,77,121,.4) 1.6px,transparent 2.2px) 0 0/16px 16px,
      radial-gradient(ellipse at 50% 105%,rgba(255,77,121,.38),transparent 60%),
      radial-gradient(ellipse at 50% 0%,#1c2a6b 0,#0b0b12 70%);
    background-color:var(--negro)}
  h1,h2,.bang{font-family:'Bangers',cursive;font-weight:400;letter-spacing:1px}
  svg.tela{position:fixed;width:min(60vw,260px);height:auto;color:#fff;opacity:.22;pointer-events:none;z-index:0}
  .tela.a{top:0;left:0}
  .tela.b{bottom:0;right:0;transform:rotate(180deg)}

  main{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:18px 16px 40px;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}

  /* ---------- Intro ---------- */
  #intro{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 0%,#24349a,#0b0b12 75%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 12vh;text-align:center;color:#fff;transition:opacity .7s,visibility .7s}
  #intro.fuera{opacity:0;visibility:hidden}
  .colgante{position:absolute;left:50%;top:0;margin-left:-45px;width:90px;display:flex;flex-direction:column;align-items:center;animation:descenso 2.4s cubic-bezier(.3,1.5,.5,1) .3s both}
  .colgante .hilo{width:2px;height:34vh;background:#fff;opacity:.9}
  .colgante svg{width:90px;height:90px;color:#fff;margin-top:-6px;animation:balanceo 3s ease-in-out 2.7s infinite;transform-origin:50% 0}
  @keyframes descenso{from{transform:translateY(-100%)}to{transform:translateY(0)}}
  @keyframes balanceo{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  #intro h1{font-size:clamp(2.2rem,10vw,3.2rem);line-height:1;text-shadow:3px 3px 0 var(--rojo);margin-bottom:10px}
  #intro p{opacity:.85;margin-bottom:22px;max-width:320px}
  .tingle{position:absolute;left:50%;top:calc(34vh + 20px);width:150px;margin-left:-75px;height:60px;pointer-events:none;opacity:0;animation:hormiguea 2.2s ease-in-out 2.8s infinite}
  .tingle i{position:absolute;top:50%;left:50%;width:3px;height:26px;background:var(--rojo);border-radius:3px;transform-origin:0 0}
  .tingle i:nth-child(1){transform:rotate(-70deg) translateY(36px)}
  .tingle i:nth-child(2){transform:rotate(-35deg) translateY(40px)}
  .tingle i:nth-child(3){transform:rotate(0deg) translateY(42px)}
  .tingle i:nth-child(4){transform:rotate(35deg) translateY(40px)}
  .tingle i:nth-child(5){transform:rotate(70deg) translateY(36px)}
  @keyframes hormiguea{0%,100%{opacity:0}30%,60%{opacity:1}}
  .btn{font-family:'Bangers',cursive;font-size:1.5rem;letter-spacing:1px;border:3px solid #000;background:var(--rojo);color:#fff;padding:10px 30px;cursor:pointer;box-shadow:5px 5px 0 #000;transform:skewX(-6deg);transition:transform .12s,box-shadow .12s}
  .btn:active{transform:skewX(-6deg) translate(3px,3px);box-shadow:2px 2px 0 #000}
  .btn.azul{background:var(--azul)}
  .btn.claro{background:#fff;color:#111}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- Cabecera y progreso ---------- */
  header{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:#fff}
  header svg{width:30px;height:30px;flex:0 0 30px}
  .prog{flex:1;display:flex;justify-content:space-between}
  .prog i{font-style:normal;font-size:1.25rem;line-height:1;color:rgba(255,255,255,.22);transition:color .4s,text-shadow .4s,transform .4s}
  .prog i.on{color:#ff4d79;text-shadow:0 0 10px #ff4d79;transform:scale(1.15)}
  .paso-n{font-family:'Bangers';font-size:1.1rem;opacity:.85;white-space:nowrap}

  /* ---------- Paneles ---------- */
  #pantalla{flex:1;display:flex;flex-direction:column;justify-content:center}
  .panel{background:#fff;border:4px solid #000;box-shadow:8px 8px 0 var(--rojo);padding:22px 16px 18px;position:relative;animation:entra .45s cubic-bezier(.2,1.2,.4,1) both}
  .panel::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(28,63,170,.12) 1.2px,transparent 1.8px) 0 0/10px 10px;pointer-events:none}
  @keyframes entra{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
  .banner{display:inline-block;background:var(--rojo);color:#fff;font-family:'Bangers';font-size:2rem;letter-spacing:1px;padding:2px 16px;border:3px solid #000;box-shadow:4px 4px 0 #000;transform:skewX(-8deg) rotate(-1.5deg);margin:-38px 0 12px -4px;position:relative}
  .panel p.texto{font-weight:800;font-size:1.02rem;line-height:1.35;margin-bottom:14px;position:relative}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
  .rejilla.una{grid-template-columns:1fr}
  .op{font-family:'Nunito';font-weight:800;font-size:.98rem;line-height:1.2;background:#fff;color:#111;border:3px solid #000;padding:13px 10px;cursor:pointer;box-shadow:4px 4px 0 #000;text-align:center;transition:transform .12s,box-shadow .12s,background .2s;position:relative}
  .op small{display:block;font-weight:600;opacity:.7;margin-top:2px;font-size:.78rem}
  .op.sel{background:var(--azul);color:#fff;transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
  .op.sel::after{content:"✓";position:absolute;top:2px;right:7px;font-size:1rem}
  .op.cine{text-align:left;padding-left:14px}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;position:relative}
  .nav .btn{font-size:1.2rem;padding:8px 20px}
  .botones2{position:relative;height:150px}
  .botones2 .btn{position:absolute}
  #bSi{left:50%;top:6px;transform:translateX(-50%) skewX(-6deg);font-size:1.7rem;transition:transform .3s}
  #bNo{transition:left .3s,top .3s}

  /* ---------- Ticket ---------- */
  .ticket{background:var(--papel);border:4px solid #000;box-shadow:8px 8px 0 var(--rojo);position:relative;animation:entra .5s both}
  .talon::before,.talon::after{content:"";position:absolute;top:-16px;width:26px;height:26px;background:#0b0b12;border:4px solid #000;border-radius:50%}
  .talon::before{left:-17px}.talon::after{right:-17px}
  .ticket .cab{background:var(--rojo);color:#fff;padding:10px 16px;border-bottom:4px solid #000}
  .ticket .cab small{display:block;font-weight:800;letter-spacing:2px;font-size:.7rem;opacity:.9}
  .ticket .cab h2{font-size:1.9rem;line-height:1}
  .ticket .cuerpo{padding:14px 16px}
  .fila{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:2px dotted rgba(0,0,0,.35);font-size:.95rem}
  .fila b{font-family:'Bangers';letter-spacing:1px;font-weight:400;font-size:1rem;color:var(--azul);white-space:nowrap}
  .fila span{text-align:right;font-weight:800}
  .talon{position:relative;border-top:3px dashed #000;padding:14px 16px 16px;text-align:center}
  .barras{height:44px;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 5px,#000 5px 6px,transparent 6px 10px,#000 10px 13px,transparent 13px 15px);margin-bottom:6px}
  .talon small{font-weight:800;letter-spacing:3px;font-size:.7rem}
  .acciones{display:grid;gap:12px;margin-top:22px}
  .acciones .btn{width:100%;font-size:1.35rem}
  .final-msg{color:#fff;text-align:center;margin-top:22px}
  .final-msg h2{font-size:2.4rem;text-shadow:3px 3px 0 var(--rojo)}

  #corazones{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  #corazones i{position:absolute;bottom:-40px;font-style:normal;color:#ff4d79;opacity:.55;animation:sube linear infinite}
  @keyframes sube{0%{transform:translateY(0) translateX(0) rotate(-10deg);opacity:0}10%{opacity:.6}50%{transform:translateY(-55vh) translateX(18px) rotate(10deg)}100%{transform:translateY(-115vh) translateX(-14px) rotate(-8deg);opacity:0}}
  .nota-amor{align-self:center;max-width:340px;margin-top:26px;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #ff4d79;padding:10px 16px;font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;line-height:1.15;text-align:center;color:#7a1233;position:relative;transform:rotate(-1.2deg);animation:entra .6s .25s both}
  .nota-amor::before{content:"";position:absolute;top:-12px;left:34px;border:8px solid transparent;border-bottom-color:#000;border-top:0}
  .nota-amor::after{content:"♥";position:absolute;right:-10px;top:-14px;font-size:1.5rem;color:#ff4d79;animation:latido 1.4s infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .sello-amor{position:absolute;right:14px;top:100px;border:3px solid #e62429;color:#e62429;font-family:'Bangers';font-size:1.25rem;letter-spacing:2px;padding:0 10px;transform:rotate(-14deg);opacity:.85;border-radius:6px;background:rgba(255,255,255,.55)}
  .dedicatoria{margin:12px 0 0;padding:10px 0 0;border-top:2px dotted rgba(0,0,0,.35);font-family:'Caveat',cursive;font-weight:700;font-size:1.3rem;line-height:1.15;color:#7a1233;text-align:center}
  .carta-final{background:#fffaf0;border:3px solid #000;box-shadow:6px 6px 0 #ff4d79;padding:18px 18px 16px;margin-top:22px;font-family:'Caveat',cursive;font-weight:600;font-size:1.45rem;line-height:1.25;color:#5a2a2a;text-align:left;white-space:pre-wrap;animation:entra .6s both}
  .carta-final .fir{display:block;text-align:right;margin-top:8px;font-size:1.7rem;color:#e62429}
  #musica{position:fixed;right:14px;bottom:14px;z-index:95;width:48px;height:48px;border-radius:50%;border:3px solid #000;background:#fff;color:#111;font-size:1.3rem;cursor:pointer;display:none;box-shadow:3px 3px 0 var(--rojo)}
  #musica.suena{animation:latido 1.2s infinite}
  .pop{position:fixed;z-index:90;pointer-events:none;font-family:'Bangers';font-size:2rem;color:#ffe600;-webkit-text-stroke:2px #000;text-shadow:3px 3px 0 var(--rojo);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="arana" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
      <path d="M42 48Q22 28 6 36"/><path d="M41 54Q16 48 4 62"/><path d="M42 61Q18 72 8 92"/><path d="M45 66Q32 84 28 98"/>
      <path d="M58 48Q78 28 94 36"/><path d="M59 54Q84 48 96 62"/><path d="M58 61Q82 72 92 92"/><path d="M55 66Q68 84 72 98"/>
    </g>
    <circle cx="50" cy="38" r="7" fill="currentColor"/>
    <ellipse cx="50" cy="58" rx="11" ry="15" fill="currentColor"/>
    <path d="M50 67C43 62 41 58.500 43 55.500C45 52.500 49 54 50 56.500C51 54 55 52.500 57 55.500C59 58.500 57 62 50 67Z" fill="#e62429"/>
  </symbol>
  <symbol id="tela" viewBox="0 0 200 200">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 0L200 0M0 0L192 62M0 0L150 150M0 0L62 192M0 0L0 200"/>
      <path d="M40 0Q22 22 0 40"/><path d="M80 0Q46 46 0 80"/><path d="M120 0Q68 68 0 120"/><path d="M160 0Q92 92 0 160"/>
    </g>
  </symbol>
</svg>
<svg class="tela a" viewBox="0 0 200 200"><use href="#tela"/></svg>
<svg class="tela b" viewBox="0 0 200 200"><use href="#tela"/></svg>
<div id="corazones"></div>

<!-- Entrada -->
<div id="intro">
  <div class="colgante"><div class="hilo"></div><svg viewBox="0 0 100 100"><use href="#arana"/></svg></div>
  <div class="tingle"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Algo late por ti…</h1>
  <p id="introTxt"></p>
  <button class="btn" id="bajar">Bajar el hilo ♥</button>
</div>

<button id="musica" title="Música" aria-label="Música">🎵</button>
<audio id="audio" loop preload="none"></audio>

<main id="app" hidden>
  <header>
    <svg viewBox="0 0 100 100"><use href="#arana"/></svg>
    <div class="prog" id="prog"></div>
    <span class="paso-n" id="pasoN"></span>
  </header>
  <div id="pantalla"></div>
</main>

<script>
/* ============================================================
   PERSONALIZA AQUÍ  (todo lo demás no hace falta tocarlo)
   ============================================================ */
const CONFIG = {
  nombre: "Sofía",                      // a quién invitas
  deParte: "Carlos",                    // quién invita
  pelicula: "Spider-Man: Brand New Day",
  telefono: "",                         // tu WhatsApp con código de país, sin + ni espacios (ej: 51999999999). Vacío = ella elige el contacto.
  // Canción de fondo (suena al tocar "Bajar el hilo"). Demo: "Epical Drums 04" de Mixkit, gratis (licencia Mixkit).
  // Para tu pedido: pon un MP3 en la misma carpeta y escribe su nombre, ej: "cancion.mp3". Vacío = sin música.
  musica: "https://assets.mixkit.co/music/679/679.mp3",
  volumen: 0.45,
  dias: [],                             // fechas "2026-11-06". Vacío = los próximos 7 días.
  horas: ["15:30", "18:00", "19:45", "21:30"],
  cines: [
    { n: "Cine Central",       d: "Centro · piso 3" },
    { n: "Mega Plaza Cinemas", d: "Mega Plaza · piso 2" },
    { n: "Cine del Parque",    d: "Parque Principal" },
    { n: "Sorpresa",           d: "Tú elige, yo te llevo" }
  ],
  formatos: [
    { n: "2D",  d: "Clásico" },
    { n: "3D",  d: "Con lentes" },
    { n: "IMAX", d: "Pantalla gigante" },
    { n: "VIP", d: "Butacas reclinables" }
  ],
  snacks: ["Canchita grande", "Nachos con queso", "Gaseosa XL", "Dulces", "Helado", "Hot dog"],
  duracionMin: 150,

  /* --- Toques románticos --- */
  frases: [                              // notas que salen debajo de cada pantalla
    "Contigo hasta el multiverso.",
    "Cualquier día contigo es el mejor día.",
    "Yo ya tengo la hora favorita: la que pasamos juntos.",
    "Mi lugar favorito del mundo eres tú.",
    "Con tal de verte, hasta en 3D.",
    "Aunque no comparto mi canchita con nadie... contigo sí."
  ],
  notaTicket: "Te veo en la fila de la canchita.",
  mensajeFinal: "Gracias por decir que sí.\n\nEsta noche no importa cuál sea la película: la mejor escena siempre eres tú.\n\nTe prometo risas, canchita compartida y tu mano en la mía.",
  mensajeWhatsApp: "Sabía que ibas a decir que sí. Esta noche te robo una sonrisa."
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const el = (t,c,h)=>{const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e;};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

if(!CONFIG.dias.length){
  for(let i=1;i<=7;i++){ const d=new Date(); d.setDate(d.getDate()+i); CONFIG.dias.push(iso(d)); }
}
const fechaTxt = s=>new Date(s+"T12:00:00").toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
const horaTxt = h=>{ const [H,M]=h.split(":").map(Number); return `${H%12||12}:${pad(M)} ${H<12?"a. m.":"p. m."}`; };

document.title = "Misión secreta: cine con " + CONFIG.deParte;
$("introTxt").textContent = `${CONFIG.nombre}, ${CONFIG.deParte} tiene una misión secreta: llevarte al cine y robarte una sonrisa.`;

/* ---- Corazones que suben de fondo ---- */
(function(){
  const c=$("corazones");
  for(let i=0;i<16;i++){
    const h=el("i",null,"♥");
    h.style.left=Math.random()*100+"%"; h.style.fontSize=(.9+Math.random()*1.5)+"rem";
    h.style.animationDuration=(9+Math.random()*10)+"s"; h.style.animationDelay=(-Math.random()*16)+"s";
    c.appendChild(h);
  }
})();

const state = { dia:null, hora:null, cine:null, formato:null, snacks:[] };
const PASOS = ["mision","dia","hora","cine","formato","snacks","resumen"];
let paso = 0;

/* ---- Efecto onomatopeya ---- */
const sonidos=["¡THWIP!","¡MUAH!","¡AWW!","♥","¡POW!","¡TE AMO!"];
function pop(x,y,txt){
  const p=el("div","pop",txt||sonidos[Math.floor(Math.random()*sonidos.length)]);
  p.style.left=x+"px"; p.style.top=y+"px"; document.body.appendChild(p);
  p.animate([{transform:"translate(-50%,-50%) scale(.3) rotate(-12deg)",opacity:0},
             {transform:"translate(-50%,-90%) scale(1.15) rotate(6deg)",opacity:1,offset:.3},
             {transform:"translate(-50%,-160%) scale(1) rotate(-4deg)",opacity:0}],
            {duration:900,easing:"ease-out"}).onfinish=()=>p.remove();
}

/* ---- Progreso ---- */
const prog=$("prog");
for(let i=0;i<PASOS.length-1;i++) prog.appendChild(el("i",null,"♥"));
function actualizarProg(){
  [...prog.children].forEach((b,i)=>b.classList.toggle("on", i<paso));
  $("pasoN").textContent = paso>=PASOS.length-1 ? "¡Listo!" : `Paso ${paso+1} de ${PASOS.length-1}`;
}

/* ---- Utilidades de pantalla ---- */
function panel(titulo, texto){
  const p=el("div","panel");
  p.appendChild(el("div","banner",titulo));
  if(texto) p.appendChild(el("p","texto",texto));
  return p;
}
function opcion(html, sel, fn, extra){
  const b=el("button","op"+(sel?" sel":"")+(extra?" "+extra:""),html);
  b.onclick=e=>{ pop(e.clientX,e.clientY); fn(b); };
  return b;
}
function navegacion(atras, siguiente, habilitado=true){
  const n=el("div","nav");
  const a=el("button","btn claro","Atrás"); a.onclick=atras; if(paso===0) a.style.visibility="hidden";
  n.appendChild(a);
  if(siguiente){ const s=el("button","btn azul","Siguiente"); s.disabled=!habilitado; s.onclick=siguiente; n.appendChild(s); }
  return n;
}
function ir(n){ paso=n; dibujar(); }
function avanzar(){ setTimeout(()=>ir(paso+1),420); }

/* ---- Pasos ---- */
const vistas = {
  mision(){
    const p=panel("MISIÓN DE AMOR", `${esc(CONFIG.nombre)}, ${esc(CONFIG.deParte)} tiene un plan: una noche de cine contigo, viendo <b>${esc(CONFIG.pelicula)}</b>. ¿Aceptas la misión más bonita de todas? ♥`);
    const z=el("div","botones2");
    const si=el("button","btn","¡Sí, acepto! ♥"); si.id="bSi";
    const no=el("button","btn claro","No"); no.id="bNo"; no.style.left="calc(50% - 30px)"; no.style.top="84px";
    const textos=["No","¿Segura? 🥺","Piénsalo, mi vida…","Mi corazón de araña llora","¡Dale que sí! 💕"]; let n=0;
    const huir=e=>{
      e&&e.preventDefault(); n++; no.textContent=textos[Math.min(n,textos.length-1)];
      no.style.left=Math.max(0,Math.random()*(z.clientWidth-no.offsetWidth))+"px";
      no.style.top=Math.max(70,Math.random()*(z.clientHeight-no.offsetHeight))+"px";
      si.style.transform=`translateX(-50%) skewX(-6deg) scale(${Math.min(1+n*.1,1.5)})`;
      pop(e&&e.clientX||innerWidth/2, e&&e.clientY||300, "¡NO!");
    };
    no.addEventListener("mouseenter",huir); no.addEventListener("touchstart",huir,{passive:false}); no.addEventListener("click",huir);
    si.onclick=e=>{ pop(e.clientX,e.clientY,"¡SABÍA QUE SÍ!"); explosionCorazones(e.clientX,e.clientY); avanzar(); };
    z.append(si,no); p.appendChild(z); return p;
  },
  dia(){
    const p=panel("¿QUÉ DÍA?","Cualquier día es perfecto si es contigo. Elige el que quieras.");
    const g=el("div","rejilla");
    CONFIG.dias.forEach(d=>{
      const f=new Date(d+"T12:00:00");
      const sem=f.toLocaleDateString("es",{weekday:"long"}), resto=f.toLocaleDateString("es",{day:"numeric",month:"long"});
      g.appendChild(opcion(`${esc(sem)}<small>${esc(resto)}</small>`, state.dia===d, ()=>{ state.dia=d; avanzar(); }));
    });
    p.append(g, navegacion(()=>ir(paso-1)));
    return p;
  },
  hora(){
    const p=panel("¿A QUÉ HORA?","Yo te espero a la hora que elijas.");
    const g=el("div","rejilla");
    CONFIG.horas.forEach(h=>g.appendChild(opcion(horaTxt(h), state.hora===h, ()=>{ state.hora=h; avanzar(); })));
    p.append(g, navegacion(()=>ir(paso-1)));
    return p;
  },
  cine(){
    const p=panel("¿DÓNDE?","Elige el lugar donde quieres que te robe una sonrisa.");
    const g=el("div","rejilla una");
    CONFIG.cines.forEach(c=>g.appendChild(opcion(`${esc(c.n)}<small>${esc(c.d)}</small>`, state.cine===c.n, ()=>{ state.cine=c.n; avanzar(); }, "cine")));
    p.append(g, navegacion(()=>ir(paso-1)));
    return p;
  },
  formato(){
    const p=panel("¿FORMATO?","¿Cómo quieres ver la película? Yo solo quiero ver tu cara cuando se emocione.");
    const g=el("div","rejilla");
    CONFIG.formatos.forEach(f=>g.appendChild(opcion(`${esc(f.n)}<small>${esc(f.d)}</small>`, state.formato===f.n, ()=>{ state.formato=f.n; avanzar(); })));
    p.append(g, navegacion(()=>ir(paso-1)));
    return p;
  },
  snacks(){
    const p=panel("COMBO DE AMOR","Elige lo que quieras comer. Puedes elegir varios, o ninguno. Lo compartimos.");
    const g=el("div","rejilla");
    CONFIG.snacks.forEach(s=>g.appendChild(opcion(esc(s), state.snacks.includes(s), b=>{
      const i=state.snacks.indexOf(s); if(i>=0) state.snacks.splice(i,1); else state.snacks.push(s);
      b.classList.toggle("sel", i<0);
    })));
    p.append(g, navegacion(()=>ir(paso-1), ()=>ir(paso+1)));
    return p;
  },
  resumen(){
    const w=el("div");
    const t=el("div","ticket");
    t.innerHTML=`<div class="cab"><small>ADMIT TWO ♥ DOS CORAZONES, UNA FUNCIÓN</small><h2>${esc(CONFIG.pelicula)}</h2></div>
      <div class="sello-amor">♥ APROBADO</div>
      <div class="cuerpo">
        <div class="fila"><b>PARA</b><span>${esc(CONFIG.nombre)} y ${esc(CONFIG.deParte)}</span></div>
        <div class="fila"><b>DÍA</b><span>${esc(fechaTxt(state.dia))}</span></div>
        <div class="fila"><b>HORA</b><span>${esc(horaTxt(state.hora))}</span></div>
        <div class="fila"><b>CINE</b><span>${esc(state.cine)}</span></div>
        <div class="fila"><b>FORMATO</b><span>${esc(state.formato)}</span></div>
        <div class="fila"><b>COMBO</b><span>${state.snacks.length?esc(state.snacks.join(", ")):"Sin snacks"}</span></div>
        <div class="dedicatoria">${esc(CONFIG.notaTicket)}</div>
      </div>
      <div class="talon"><div class="barras"></div><small>MISIÓN DE AMOR ACEPTADA ♥</small></div>`;
    w.appendChild(t);
    const ac=el("div","acciones");
    const wa=el("button","btn","Confirmar por WhatsApp"); wa.onclick=enviarWhatsApp;
    const cal=el("button","btn azul","Agregar al calendario"); cal.onclick=descargarICS;
    const ed=el("button","btn claro","Cambiar algo"); ed.onclick=()=>ir(1);
    ac.append(wa,cal,ed); w.appendChild(ac);
    return w;
  }
};

function dibujar(){
  const v=vistas[PASOS[paso]]();
  $("pantalla").innerHTML=""; $("pantalla").appendChild(v);
  if(paso>0 && paso<PASOS.length-1 && CONFIG.frases.length){
    $("pantalla").appendChild(el("div","nota-amor",esc(CONFIG.frases[(paso-1)%CONFIG.frases.length])));
  }
  actualizarProg(); scrollTo(0,0);
}

/* ---- Salidas: WhatsApp y calendario ---- */
function mensaje(){
  return `¡Acepté la misión de amor! 🕷️💖🎬\n\n`+
    `Película: ${CONFIG.pelicula}\n`+
    `Día: ${fechaTxt(state.dia)}\n`+
    `Hora: ${horaTxt(state.hora)}\n`+
    `Cine: ${state.cine}\n`+
    `Formato: ${state.formato}\n`+
    `Combo: ${state.snacks.length?state.snacks.join(", "):"sin snacks"}\n\n`+
    `Nos vemos en el cine, ${CONFIG.deParte} 💖\n${CONFIG.mensajeWhatsApp}`;
}
function enviarWhatsApp(e){
  const tel=(CONFIG.telefono||"").replace(/\D/g,"");
  const url=`https://wa.me/${tel}?text=${encodeURIComponent(mensaje())}`;
  pop(e.clientX,e.clientY,"¡ENVIADO!");
  window.open(url,"_blank");
  if(!document.querySelector(".final-msg")){
    const m=el("div","final-msg","<h2>¡Misión de amor aceptada!</h2><p>Si no se abrió WhatsApp, pulsa de nuevo el botón.</p>");
    const c=el("div","carta-final"); c.textContent=CONFIG.mensajeFinal+"\n";
    const f=el("span","fir"); f.textContent="— "+CONFIG.deParte+" ♥"; c.appendChild(f);
    $("pantalla").append(m,c);
    setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"center"}),400);
  }
  lluvia();
}
function descargarICS(){
  const ini=new Date(`${state.dia}T${state.hora}:00`), fin=new Date(ini.getTime()+CONFIG.duracionMin*60000);
  const f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const cuerpo=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mision secreta//ES","BEGIN:VEVENT",
    `UID:${Date.now()}@mision-cine`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(ini)}`,`DTEND:${f(fin)}`,
    `SUMMARY:Cine: ${CONFIG.pelicula}`,`LOCATION:${state.cine}`,
    `DESCRIPTION:Formato ${state.formato}. Combo: ${state.snacks.join(", ")||"sin snacks"}.`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=el("a"); a.href=URL.createObjectURL(new Blob([cuerpo],{type:"text/calendar"})); a.download="cine.ics"; a.click();
}
function lluvia(){
  const em=["💖","🕸️","💕","🕷️","❤️","🎬","💗","🍿"];
  for(let i=0;i<40;i++){
    const s=el("span","pop",em[i%em.length]); s.style.cssText=`left:${Math.random()*100}vw;top:-30px;font-size:${1.4+Math.random()*1.4}rem;-webkit-text-stroke:0;text-shadow:none`;
    document.body.appendChild(s);
    s.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:`translateY(${innerHeight+60}px) rotate(${Math.random()*360}deg)`,opacity:.9}],
      {duration:2200+Math.random()*2000,delay:Math.random()*900,easing:"ease-in",fill:"both"}).onfinish=()=>s.remove();
  }
}

function explosionCorazones(x,y){
  for(let i=0;i<14;i++){
    const s=el("span","pop","♥"); s.style.cssText=`left:${x}px;top:${y}px;font-size:${1.2+Math.random()*1.4}rem;color:#ff4d79;-webkit-text-stroke:0;text-shadow:0 0 8px #ff4d79`;
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=60+Math.random()*130;
    s.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},
               {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-60}px)) scale(1)`,opacity:0}],
              {duration:1000+Math.random()*600,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove();
  }
}

/* ---- Inicio ---- */
/* ---- Música ---- */
const audio=$("audio");
if(CONFIG.musica){ audio.src=CONFIG.musica; audio.volume=CONFIG.volumen; $("musica").style.display="block"; }
$("musica").onclick=()=>{ if(audio.paused) audio.play(); else audio.pause(); };
audio.onplay=()=>{ $("musica").textContent="🎵"; $("musica").classList.add("suena"); };
audio.onpause=()=>{ $("musica").textContent="🔇"; $("musica").classList.remove("suena"); };

$("bajar").onclick=e=>{
  pop(e.clientX,e.clientY,"¡THWIP!");
  if(CONFIG.musica) audio.play().catch(()=>{});
  $("intro").classList.add("fuera");
  $("app").hidden=false; dibujar();
};
</script>
